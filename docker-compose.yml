services:
  dp-security-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: dp-security-platform:latest
    container_name: dp-security-platform
    ports:
      - "5000:5000"
    environment:
      # Templates are baked at image build; set to "1" only when you need a refresh.
      UPDATE_NUCLEI_TEMPLATES: "0"
      PYTHONUNBUFFERED: "1"
      # Set a strong secret key in production — if unset, a random key is
      # generated per-process which invalidates sessions on restart.
      DP_SECURITY_PLATFORM_SECRET_KEY: ""
    volumes:
      - ./config:/app/config
      # Named volume keeps raw scan output off the host project folder
      # that VPS malware scanners typically walk.
      - scan-data:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped
    # Leave ~512MB for the host OS/Docker on a 2GB VPS.
    mem_limit: 1536m
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_MODULE
      - MKNOD
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/app/docker/healthcheck.sh"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 5

volumes:
  scan-data:
    name: dp-security-platform-scan-data
